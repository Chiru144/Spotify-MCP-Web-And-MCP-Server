name: Publish to PyPI and the MCP Registry

# Release by bumping the version and pushing a matching tag:
#   python packaging/build_packages.py --set-version 1.2.0
#   git commit -am "release: 1.2.0" && git tag v1.2.0 && git push origin main v1.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt build

      - name: Check versions, server.json and the mcp-name marker
        run: python packaging/build_packages.py --check

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in server.json" >&2
            exit 1
          fi

      - name: Run packaging tests
        run: python -m pytest -q tests/test_packaging.py tests/test_toolsets.py

      - name: Build both packages
        run: python packaging/build_packages.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish spotify-soundtrack-mcp
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/spotify-soundtrack-mcp/
          skip-existing: true

      - name: Publish spotify-mcp-web
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/spotify-mcp-web/
          skip-existing: true

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry GitHub OIDC login
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5

      - name: Wait for the release to appear on PyPI
        run: |
          version=$(jq -r .version server.json)
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/spotify-soundtrack-mcp/${version}/json" > /dev/null; then
              echo "spotify-soundtrack-mcp ${version} is on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "spotify-soundtrack-mcp ${version} did not appear on PyPI" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
